# Manifest to set up dependencies under <west topdir>/dependencies
# (west init -l config --mf west-standalone.yml) or under <west topdir>
# (west init -l . --mf config/west.yml).
#
# The real dependency list lives in west-dependency.yml, shared by both
# layouts so they can never drift apart.
manifest:
  self:
    path: config
    import: west-dependency.yml
